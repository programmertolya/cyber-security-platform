server {
    listen 80;

    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # СОБИРАЕМ ВСЕ ЗАГОЛОВКИ ЗДЕСЬ. 
    # ВАЖНО: Внутри location больше не должно быть add_header!
    
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Content-Security-Policy-Report-Only "
            default-src 'self'; 
            script-src 'self' 'unsafe-inline'; 
            style-src 'self' 'unsafe-inline'; 
            img-src 'self' data:; 
            font-src 'self'; 
            connect-src 'self'; 
            report-uri /csp-report-endpoint;
        " always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        
    }
    # Прокси на бэкенд (имя 'backend' берем из docker-compose)
    location /api/ {
        proxy_pass http://azbuka_api:8080/api/;

    }

    location /api/Ai/hint {
         proxy_pass http://azbuka_api:8080/api/Ai/hint;
         proxy_http_version 1.1;
         proxy_set_header Connection '';
         proxy_buffering off;           # ← отключаем буферизацию
         proxy_read_timeout 300s;       # ← таймаут 5 минут
         proxy_connect_timeout 300s;

	 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
}
    location /csp-report-endpoint {
    return 204;
}
}